<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Boreal</title>

<style>
body {
    margin: 0;
    font-family: monospace;
    background: #050914;
    color: white;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 600px;
    margin: auto;
    padding-top: 70px;
    text-align: center;
}
/* 🌌 AURORA BOREAL */
body::before,
body::after {
    content: "";
    position: fixed;
    width: 70vw;
    height: 70vh;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.22;
    z-index: -1;
    pointer-events: none;
}

body::before {
    background: #00ff88;
    top: -25%;
    left: -15%;
    animation: aurora1 9s ease-in-out infinite alternate;
}

body::after {
    background: #0066ff;
    bottom: -25%;
    right: -15%;
    animation: aurora2 11s ease-in-out infinite alternate;
}

@keyframes aurora1 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30vw, 15vh) scale(1.3); }
    100% { transform: translate(5vw, 35vh) scale(1); }
}

@keyframes aurora2 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-25vw, -20vh) scale(1.35); }
    100% { transform: translate(-5vw, -5vh) scale(1); }
}
h1 {
    font-size: 38px;
}

.subtitle {
    color: #9ca8bd;
}

.box {
    background: #0d1424;
    border: 1px solid #26334d;
    border-radius: 15px;
    padding: 25px;
    margin-top: 25px;
}

input {
    width: 90%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #34425d;
    background: #080d18;
    color: white;
    font-size: 16px;
}

button {
    width: 96%;
    margin-top: 12px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #4d7cff;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

#error {
    color: #ff6262;
    display: none;
}

#contenido {
    display: none;
}

#terminal {
    display: none;
    text-align: left;
    background: #020602;
    border: 1px solid #20ff75;
    border-radius: 12px;
    padding: 20px;
    color: #20ff75;
    min-height: 220px;
    box-shadow: 0 0 15px #20ff7533;
}

#terminalText {
    white-space: pre-line;
    line-height: 1.7;
}

.cursor {
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

.file {
    display: block;
    background: #111b2e;
    color: white;
    text-decoration: none;
    padding: 15px;
    border-radius: 10px;
    margin-top: 12px;
}
</style>
</head>

<body>

<div class="container">

<div id="login">

<h1>🌌 Aurora Boreal</h1>

<p class="subtitle">Área privada</p>

<div class="box">

<input
type="password"
id="password"
placeholder="Escribe la contraseña">

<button onclick="entrar()">ENTRAR</button>

<p id="error">Contraseña incorrecta</p>

</div>
</div>


<div id="terminal">

<div id="terminalText"></div><span class="cursor">█</span>

</div>


<div id="contenido">

<h1>🌌 Aurora Boreal</h1>

<p class="subtitle">Archivos privados</p>

<div class="box">

<h2>📁 Mis archivos</h2>

<a class="file" href="#">
📄 Documentos
</a>

<a class="file" href="dNzkoOn.png">
🖼️ Fotografías
</a>

<a class="file" href="#">
📁 Otros archivos
</a>

</div>
</div>

</div>


<script>

function entrar() {

let password =
document.getElementById("password").value;

if (password === "SAMARITAN") {

document.getElementById("login").style.display = "none";

document.getElementById("terminal").style.display = "block";

let texto =
"> INITIALIZING AURORA BOREAL...\n" +
"> CONNECTING TO SYSTEM...\n" +
"> CHECKING SECURITY...\n" +
"> ACCESS GRANTED\n" +
"> WELCOME, ADMIN\n" +
"> SYSTEM ONLINE";

let i = 0;

let intervalo = setInterval(function() {

document.getElementById("terminalText").textContent =
texto.substring(0, i);

i++;

if (i > texto.length) {

clearInterval(intervalo);

setTimeout(function() {

document.getElementById("terminal").style.display = "none";

document.getElementById("contenido").style.display = "block";

}, 1200);

}

}, 35);

} else {

document.getElementById("error").style.display = "block";

}

}

</script>

</body>
</html>
