<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Boreal</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#020711;
color:#dffcff;
font-family:Arial,Helvetica,sans-serif
}

body{position:relative}

body:before,body:after{
content:"";
position:fixed;
width:70vw;
height:70vh;
border-radius:50%;
filter:blur(100px);
opacity:.2;
pointer-events:none;
z-index:0
}

body:before{
background:#00ff9d;
left:-20%;
top:-25%;
animation:a1 10s ease-in-out infinite alternate
}

body:after{
background:#155cff;
right:-20%;
bottom:-25%;
animation:a2 12s ease-in-out infinite alternate
}

@keyframes a1{
to{transform:translate(30vw,18vh) scale(1.3)}
}

@keyframes a2{
to{transform:translate(-25vw,-20vh) scale(1.3)}
}

/* LOGIN */

#login{
position:fixed;
inset:0;
z-index:20;
display:flex;
align-items:center;
justify-content:center;
background:#020711
}

.loginBox{
width:min(420px,90vw);
padding:34px;
border:1px solid #1ce9d0;
border-radius:18px;
background:#07101ce8;
box-shadow:0 0 45px #00e0c52b;
text-align:center
}

.loginBox h1{
letter-spacing:10px;
margin:0 0 8px;
font-weight:400
}

.loginBox p{color:#7794a8}

.loginBox input{
width:100%;
padding:15px;
border-radius:9px;
border:1px solid #294354;
background:#030912;
color:#fff;
outline:none
}

.loginBox button{
width:100%;
margin-top:12px;
padding:14px;
border:1px solid #18e7d2;
border-radius:9px;
background:#07302f;
color:#bffff8;
font-weight:bold;
cursor:pointer
}

.err{
display:none;
color:#ff6175!important
}

/* TERMINAL */

#terminal{
position:fixed;
inset:0;
z-index:19;
display:none;
align-items:center;
justify-content:center;
background:#010706
}

.term{
width:min(650px,88vw);
padding:25px;
color:#28ff91;
font-family:monospace;
line-height:1.8;
border:1px solid #20ff75;
background:#020a06;
box-shadow:0 0 40px #20ff7522
}

.cursor{animation:blink .7s infinite}

@keyframes blink{
50%{opacity:0}
}

/* APP */

#app{
position:fixed;
inset:0;
z-index:2;
display:none
}

.top{
position:absolute;
top:22px;
left:30px;
right:30px;
display:flex;
justify-content:space-between;
z-index:5;
letter-spacing:4px
}

.brand{
color:#25eee0;
font-size:22px
}

.status{
font-size:11px;
color:#7ca3ad;
letter-spacing:2px
}

.status b{color:#1fffb0}

.scene{
position:absolute;
inset:0;
perspective:900px;
overflow:hidden
}

.world{
position:absolute;
width:100%;
height:100%;
transform-style:preserve-3d;
transition:transform 1.5s cubic-bezier(.2,.8,.2,1)
}

/* FLOWS */

svg{
position:absolute;
inset:0;
width:100%;
height:100%;
overflow:visible
}

.flow{
fill:none;
stroke-width:2;
opacity:.75;
stroke-dasharray:7 13;
animation:flow 7s linear infinite
}

.flow2{
fill:none;
stroke-width:1;
opacity:.25
}

.cyan{stroke:#17e8db}
.blue{stroke:#3c8dff}
.purple{stroke:#b65cff}
.green{stroke:#35ffa2}

@keyframes flow{
to{stroke-dashoffset:-200}
}

/* ORBITS */

.orbit{
fill:none;
stroke:#43e8dd;
stroke-width:1;
opacity:.16
}

/* CORE */

.core{
position:absolute;
left:50%;
top:50%;
width:175px;
height:175px;
transform:translate(-50%,-50%);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
border:1px solid #35fff0;
background:radial-gradient(
circle,
#0b3940 0%,
#04141e 45%,
#020711 72%
);
box-shadow:
0 0 25px #16e8d355,
0 0 90px #16e8d322;
z-index:4
}

.core:before,
.core:after{
content:"";
position:absolute;
border-radius:50%;
border:1px solid #35fff055
}

.core:before{
inset:-18px;
animation:spin 12s linear infinite
}

.core:after{
inset:-35px;
border-style:dashed;
animation:spin 18s linear infinite reverse
}

.core span{
letter-spacing:9px;
font-size:24px;
color:#bffff9;
margin-left:9px
}

@keyframes spin{
to{transform:rotate(360deg)}
}

/* NODES */

.node{
position:absolute;
width:112px;
height:112px;
border-radius:50%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#03111cbb;
border:1px solid currentColor;
box-shadow:0 0 25px currentColor;
z-index:3;
transition:1s;
cursor:pointer
}

.node strong{
font-size:12px;
letter-spacing:3px
}

.node small{
font-size:9px;
margin-top:7px;
opacity:.65;
letter-spacing:1px
}

.images{
left:19%;
top:22%;
color:#22f0dd
}

.files{
right:19%;
top:22%;
color:#4d9dff
}

.notes{
left:17%;
bottom:20%;
color:#bd64ff
}

.system{
right:17%;
bottom:20%;
color:#38ffa4
}

.node.focus{
transform:scale(1.35);
box-shadow:
0 0 35px currentColor,
0 0 90px currentColor
}

.node.dim{
opacity:.12;
filter:blur(2px)
}

.icon{
font-size:25px;
margin-bottom:5px
}

/* COMMAND */

.command{
position:absolute;
left:50%;
bottom:42px;
transform:translateX(-50%);
width:min(760px,82vw);
height:58px;
border:1px solid #20e9d6;
border-radius:35px;
background:#020b14d9;
box-shadow:0 0 35px #00e0d522;
display:flex;
align-items:center;
padding:0 20px;
z-index:10
}

.command span{
color:#23f2df;
font-size:24px;
margin-right:12px
}

.command input{
flex:1;
background:none;
border:0;
outline:0;
color:#dff;
font-size:16px;
font-family:monospace
}

.command input::placeholder{
color:#58717f
}

.help{
position:absolute;
bottom:12px;
left:30px;
color:#547887;
font:11px monospace;
letter-spacing:1px
}

.help b{color:#1ce8d4}

.message{
position:absolute;
top:100px;
left:50%;
transform:translateX(-50%);
color:#76a8b4;
font:11px monospace;
letter-spacing:3px;
opacity:0;
transition:.4s
}

.message.show{opacity:1}

/* AURORA SYSTEM LOG */

#systemLog{
position:absolute;
right:30px;
top:105px;
width:270px;
height:225px;
padding:14px;
border:1px solid #174854;
background:#020b14d9;
box-shadow:0 0 25px #00e0d522;
font:10px monospace;
color:#6fffe9;
overflow:hidden;
z-index:8;
pointer-events:none
}

#systemLogTitle{
color:#4fffe9;
letter-spacing:2px;
border-bottom:1px solid #17313b;
padding-bottom:8px;
margin-bottom:8px
}

#systemLogText{
line-height:1.7
}

#systemLogText div{
opacity:0;
animation:logAppear .3s forwards
}

@keyframes logAppear{
to{opacity:1}
}

/* PANEL */

.panel{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:#010812e8;
z-index:15
}

.panelBox{
width:min(650px,88vw);
padding:30px;
border:1px solid #20e9d6;
background:#06131ef0;
box-shadow:0 0 50px #00e0d533
}

.panelBox h2{
letter-spacing:5px;
color:#4fffe9
}

.panelBox a{
display:block;
color:#dff;
text-decoration:none;
padding:13px;
border-bottom:1px solid #17313b
}

.close{
margin-top:20px;
color:#1ff0dd;
cursor:pointer;
font-family:monospace
}

/* FILES */

.dataGrid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(150px,1fr));
gap:12px;
max-height:48vh;
overflow:auto;
margin-top:15px
}

.dataCard{
display:block!important;
border:1px solid #17313b!important;
padding:10px!important;
background:#030b14;
text-decoration:none
}

.dataCard:hover{
border-color:#20e9d6!important;
box-shadow:0 0 18px #00e0d522
}

.dataCard img{
width:100%;
height:115px;
object-fit:cover;
display:block;
margin-bottom:8px
}

.fileIcon{
font-size:28px;
margin-bottom:8px
}

.fileName{
font-size:11px;
word-break:break-word;
color:#dff
}

.fileMeta{
font-size:9px;
color:#6f909c;
margin-top:5px
}

.empty{
color:#6f909c;
font:12px monospace;
padding:20px 0
}

.loading{
color:#4fffe9;
font:12px monospace;
padding:20px 0
}

/* SYSTEM */

.systemGrid{
display:grid;
gap:8px;
margin-top:15px
}

.systemRow{
display:flex;
justify-content:space-between;
gap:20px;
border-bottom:1px solid #17313b;
padding:10px 0;
font:11px monospace
}

.systemRow b{
color:#4fffe9;
font-weight:normal
}

/* MOBILE */

@media(max-width:700px){

.top{
left:15px;
right:15px;
top:15px
}

.brand{font-size:16px}

.core{
width:125px;
height:125px
}

.core span{font-size:17px}

.node{
width:86px;
height:86px
}

.node strong{font-size:9px}

.node small{display:none}

.images{
left:5%;
top:23%
}

.files{
right:5%;
top:23%
}

.notes{
left:5%;
bottom:23%
}

.system{
right:5%;
bottom:23%
}

.command{
bottom:30px;
width:92vw
}

.help{display:none}

#systemLog{
right:10px;
top:90px;
width:190px;
height:150px;
font-size:9px
}

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">
<div class="loginBox">

<h1>AURORA</h1>

<p>ÁREA PRIVADA</p>

<input
id="password"
type="password"
placeholder="Escribe la contraseña"

<button onclick="entrar()">ENTRAR</button>

Contraseña incorrecta

<script>

/* LOGIN */

function entrar(){

const p=document.getElementById('password').value;

if(p==='SAMARITAN'){

document.getElementById('login').style.display='none';

const t=document.getElementById('terminal');

t.style.display='flex';

let s=`> INITIALIZING AURORA...
> CONNECTING TO SYSTEM...
> CHECKING SECURITY...
> ACCESS GRANTED
> WELCOME, ADMIN
> SYSTEM ONLINE`;

let i=0;

const out=document.getElementById('terminalText');

const timer=setInterval(()=>{

out.textContent=s.substring(0,i++);

if(i>s.length){

clearInterval(timer);

setTimeout(()=>{

t.style.display='none';

document.getElementById('app').style.display='block';

},800);

}

},28);

}else{

document.getElementById('error').style.display='block';

}

}


/* ELEMENTOS */

const nodes=[
...document.querySelectorAll('.node')
];

const world=document.getElementById('world');

const msg=document.getElementById('message');

const logText=document.getElementById('systemLogText');


/* SYSTEM LOG */

function runLog(lines){

logText.innerHTML='';

let i=0;

const timer=setInterval(()=>{

if(i>=lines.length){

clearInterval(timer);

return;

}

const line=document.createElement('div');

line.textContent='> '+lines[i++];

logText.appendChild(line);

},350);

}


/* REPOSITORIO */

function getRepoInfo(){

const host=location.hostname;

if(!host.endsWith('.github.io')) return null;

const owner=host.split('.')[0];

const parts=location.pathname
.split('/')
.filter(Boolean);

const repo=parts.length
?parts[0]
:owner+'.github.io';

return {
owner,
repo
};

}


function apiUrl(folder){

const r=getRepoInfo();

return r
?`https://api.github.com/repos/${r.owner}/${r.repo}/contents/${folder}`
:null;

}


/* SEGURIDAD HTML */

function esc(v){

return String(v).replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

}


/* OBTENER CARPETA */

async function getFolder(folder){

const url=apiUrl(folder);

if(!url)
throw new Error('REPO_NOT_DETECTED');

const res=await fetch(
url,
{
headers:{
Accept:'application/vnd.github+json'
}
}
);

if(res.status===404)
return [];

if(!res.ok)
throw new Error('GITHUB_'+res.status);

const data=await res.json();

return Array.isArray(data)
?data
:[];

}


/* TAMAÑO */

function formatSize(bytes){

if(bytes<1024)
return bytes+' B';

if(bytes<1024*1024)
return (bytes/1024).toFixed(1)+' KB';

return (bytes/1024/1024).toFixed(1)+' MB';

}


/* LOADING */

function showLoading(title){

document.getElementById('panelTitle')
.textContent=title;

document.getElementById('panelContent')
.innerHTML=
'<div class="loading">> CONNECTING TO AURORA STORAGE...</div>';

document.getElementById('panel')
.style.display='flex';

}


/* IMAGES */

async function renderImages(){

showLoading('IMAGES');

try{

const items=await getFolder('images');

const imgs=items.filter(
x=>
x.type==='file' &&
/\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i.test(x.name)
);

if(!imgs.length){

document.getElementById('panelContent')
.innerHTML=
'<div class="empty">> NO IMAGES FOUND<br><br>Sube tus fotos a la carpeta <b>images</b> del repositorio.</div>';

return;

}


document.getElementById('panelContent')
.innerHTML=
'<div class="dataGrid">'+

imgs.map(x=>`

<a
class="dataCard"
href="${esc(x.download_url||x.html_url)}"
target="_blank"
rel="noopener"
>

<img
src="${esc(x.download_url)}"
alt="${esc(x.name)}"
>

<div class="fileName">
${esc(x.name)}
</div>

<div class="fileMeta">
ABRIR · ${formatSize(x.size||0)}
</div>

</a>

`).join('')+

'</div>';

}catch(e){

showError(e);

}

}


/* FILES */

async function renderFiles(){

showLoading('FILES');

try{

const items=await getFolder('files');

const files=items.filter(
x=>x.type==='file'
);

if(!files.length){

document.getElementById('panelContent')
.innerHTML=
'<div class="empty">> NO FILES FOUND<br><br>Sube tus archivos a la carpeta <b>files</b> del repositorio.</div>';

return;

}


document.getElementById('panelContent')
.innerHTML=
'<div class="dataGrid">'+

files.map(x=>`

<a
class="dataCard"
href="${esc(x.download_url||x.html_url)}"
target="_blank"
rel="noopener"
>

<div class="fileIcon">
${fileIcon(x.name)}
</div>

<div class="fileName">
${esc(x.name)}
</div>

<div class="fileMeta">
${ext(x.name)} · ${formatSize(x.size||0)} · ABRIR
</div>

</a>

`).join('')+

'</div>';

}catch(e){

showError(e);

}

}


/* NOTES */

async function renderNotes(){

showLoading('NOTES');

try{

const items=await getFolder('notes');

const notes=items.filter(
x=>
x.type==='file' &&
/\.(txt|md|markdown|json)$/i.test(x.name)
);

if(!notes.length){

document.getElementById('panelContent')
.innerHTML=
'<div class="empty">> NO NOTES FOUND<br><br>Sube .txt, .md o .json a la carpeta <b>notes</b>.</div>';

return;

}


document.getElementById('panelContent')
.innerHTML=
'<div class="dataGrid">'+

notes.map(x=>`

<a
class="dataCard"
href="${esc(x.download_url||x.html_url)}"
target="_blank"
rel="noopener"
>

<div class="fileIcon">▤</div>

<div class="fileName">
${esc(x.name)}
</div>

<div class="fileMeta">
NOTA · ABRIR
</div>

</a>

`).join('')+

'</div>';

}catch(e){

showError(e);

}

}


/* EXTENSION */

function ext(name){

const p=name.split('.');

return p.length>1
?p.pop().toUpperCase()
:'FILE';

}


/* ICONO */

function fileIcon(name){

const e=ext(name);

if(['PDF'].includes(e))
return '▣';

if(['DOC','DOCX','TXT','MD'].includes(e))
return '▤';

if(['ZIP','RAR','7Z'].includes(e))
return '▦';

if(['MP3','WAV','OGG'].includes(e))
return '♫';

if(['MP4','MOV','WEBM'].includes(e))
return '▶';

return '□';

}


/* ERROR */

function showError(e){

const c=document.getElementById('panelContent');

if(e.message==='REPO_NOT_DETECTED'){

c.innerHTML=
'<div class="empty">> REPOSITORY NOT DETECTED<br><br>Abre AURORA desde GitHub Pages para conectar el almacenamiento.</div>';

}else{

c.innerHTML=
'<div class="empty">> STORAGE CONNECTION ERROR<br><br>Revisa que el repositorio sea público y que las carpetas existan.</div>';

}

}


/* SYSTEM */

function systemInfo(){

const r=getRepoInfo();

const now=new Date();

const online=navigator.onLine;

showPanel('SYSTEM',[]);

document.getElementById('panelContent')
.innerHTML=`

<div class="systemGrid">

<div class="systemRow">
<span>STATUS</span>
<b>${online?'ONLINE':'OFFLINE'}</b>
</div>

<div class="systemRow">
<span>AURORA</span>
<b>ACTIVE</b>
</div>

<div class="systemRow">
<span>STORAGE</span>
<b>${r?esc(r.owner+'/'+r.repo):'NOT DETECTED'}</b>
</div>

<div class="systemRow">
<span>TIME</span>
<b>${esc(now.toLocaleString())}</b>
</div>

<div class="systemRow">
<span>PLATFORM</span>
<b>${esc(navigator.platform||'UNKNOWN')}</b>
</div>

<div class="systemRow">
<span>LANGUAGE</span>
<b>${esc(navigator.language||'UNKNOWN')}</b>
</div>

</div>

`;

}


/* COMANDOS */

function navigate(cmd){

cmd=cmd.toLowerCase().trim();

if(!cmd)
return;


if(cmd==='help'){

showPanel('COMMANDS',[

'home — regresar al núcleo',

'files — archivos reales de /files',

'images — fotos reales de /images',

'notes — notas reales de /notes',

'system — estado del sistema',

'clear — cerrar panel'

]);

return;

}
